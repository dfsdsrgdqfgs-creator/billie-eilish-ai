<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TNForums</title>

<link rel="stylesheet" href="/style.css">

</head>

<body>

<div class="top-header">

  <div class="top-left">

    <a href="#">🏠 Home</a>

    <a href="#">💬 Forums</a>

    <a href="#">⭐ Premium</a>

  </div>

  <div class="top-right">

    <button class="login-btn">
      Login
    </button>

    <button class="register-btn">
      Register
    </button>

  </div>

</div>

<div class="main">

  <div class="forum-top-tabs">

    <button class="active-tab">
      General
    </button>

    <button>
      Gaming
    </button>

    <button>
      Tech
    </button>

  </div>

  <section class="real-forum">

    <div class="real-forum-header">
      🏠 Main Forums
    </div>

    <div class="real-forum-item">

      <div class="real-forum-icon">
        📢
      </div>

      <div class="real-forum-info">

        <h2>
          <a href="#">
            Announcements
          </a>
        </h2>

        <p>
          Official forum news and updates.
        </p>

      </div>

      <div class="forum-stats">

        <strong>0</strong>

        THREADS

      </div>

      <div class="forum-stats">

        <strong>0</strong>

        POSTS

      </div>

    </div>

    <div class="real-forum-item">

      <div class="real-forum-icon">
        💬
      </div>

      <div class="real-forum-info">

        <h2>
          <a href="#">
            General Discussion
          </a>
        </h2>

        <p>
          Talk casually with members.
        </p>

      </div>

      <div class="forum-stats">

        <strong>0</strong>

        THREADS

      </div>

      <div class="forum-stats">

        <strong>0</strong>

        POSTS

      </div>

    </div>

  </section>

</div>

</body>

</html>
