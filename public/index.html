<!-- public/index.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Forum</title>

  <style>
    body{
      background:#0f0f0f;
      color:white;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .box{
      background:#1c1c1c;
      padding:30px;
      border-radius:20px;
      width:300px;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      background:#2b2b2b;
      color:white;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:15px;
      border:none;
      border-radius:10px;
      background:#4da6ff;
      color:white;
      cursor:pointer;
    }

    #message{
      margin-top:15px;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>Forum Login</h1>

  <input type="text" id="username" placeholder="Username">

  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">
    Login
  </button>

  <button onclick="register()">
    Register
  </button>

  <div id="message"></div>
</div>

<script>
async function login(){
  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;

  const res = await fetch("/login",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      username,
      password
    })
  });

  const data = await res.json();

  if(data.success){
    window.location="/profile";
  }else{
    document.getElementById("message").innerText =
      data.message;
  }
}

async function register(){
  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;

  const res = await fetch("/register",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      username,
      password
    })
  });

  const data = await res.json();

  if(data.success){
    window.location="/profile";
  }else{
    document.getElementById("message").innerText =
      data.message;
  }
}
</script>

</body>
</html>
