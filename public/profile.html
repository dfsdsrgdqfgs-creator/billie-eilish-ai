<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Sidebar -->

<aside class="sidebar">

  <div class="logo">
    He Gallery
  </div>

  <nav>

    <a href="index.html">🏠 Home</a>

    <a href="forum.html">💬 Forum</a>

  </nav>

</aside>

<!-- Top Bar -->

<div class="top-user-bar">

  <div class="user-icons">

    <span>✉️</span>

    <span>🔔</span>

  </div>

  <div class="user-profile">

    <img src="icon.jpg" class="user-avatar">

    <span id="topUsername">
      Guest
    </span>

  </div>

</div>

<!-- Main -->

<main class="main">

  <!-- Upload Banner -->

  <div class="upload-banner-box">

    <input type="file" id="bannerInput" accept="image/*,gif/*">

    <button onclick="uploadBanner()">
      Upload Banner
    </button>

  </div>

  <!-- Upload Avatar -->

  <div class="upload-avatar-box">

    <input type="file" id="avatarInput" accept="image/*,gif/*">

    <button onclick="uploadAvatar()">
      Upload Avatar
    </button>

  </div>

  <!-- Profile Banner -->

  <div class="profile-banner">

    <img src="banner.jpg" class="profile-banner-img" id="profileBanner">

    <div class="profile-content">

      <!-- Avatar -->

      <img src="icon.jpg" class="profile-avatar" id="profileAvatar">

      <!-- User Info -->

      <div class="profile-info">

        <h1 id="profileUsername">
          Guest
        </h1>

        <p>
          Joined: 2026
        </p>

        <p>
          Last seen: Online now
        </p>

      </div>

    </div>

  </div>

  <!-- Stats -->

  <div class="profile-stats">

    <div class="stat-box">

      <h3>
        Messages
      </h3>

      <p>
        0
      </p>

    </div>

    <div class="stat-box">

      <h3>
        Reactions
      </h3>

      <p>
        0
      </p>

    </div>

    <div class="stat-box">

      <h3>
        Points
      </h3>

      <p>
        0
      </p>

    </div>

  </div>

  <!-- Tabs -->

  <div class="profile-tabs">

    <button>
      Profile posts
    </button>

    <button>
      About
    </button>

    <button>
      Awards
    </button>

    <button>
      Ratings
    </button>

  </div>

</main>

<script>

/* Load Username */

async function loadProfile(){

  const response = await fetch('/me');

  const data = await response.json();

  if(data.loggedIn){

    document.getElementById('profileUsername').innerText = data.username;

    document.getElementById('topUsername').innerText = data.username;

  }

}

loadProfile();

/* Upload Avatar */

function uploadAvatar(){

  const file = document.getElementById('avatarInput').files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    document.getElementById('profileAvatar').src = e.target.result;

    localStorage.setItem('profileAvatar', e.target.result);

  };

  reader.readAsDataURL(file);

}

/* Upload Banner */

function uploadBanner(){

  const file = document.getElementById('bannerInput').files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    document.getElementById('profileBanner').src = e.target.result;

    localStorage.setItem('profileBanner', e.target.result);

  };

  reader.readAsDataURL(file);

}

/* Load Saved Avatar */

const savedAvatar = localStorage.getItem('profileAvatar');

if(savedAvatar){

  document.getElementById('profileAvatar').src = savedAvatar;

}

/* Load Saved Banner */

const savedBanner = localStorage.getItem('profileBanner');

if(savedBanner){

  document.getElementById('profileBanner').src = savedBanner;

}

</script>

</body>
</html>
