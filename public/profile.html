<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<link rel="stylesheet" href="/style.css?v=20">

</head>

<body>

<!-- TOP HEADER -->

<div class="top-header">

  <div class="top-left">

    <a href="index.html">🏠 Home</a>

    <a href="forum.html">💬 Forums</a>

  </div>

</div>

<!-- PROFILE -->

<div class="xen-profile">

  <!-- COVER -->

  <div class="xen-cover">

    <img
      src="icon.jpg"
      class="xen-avatar"
    >

    <div class="xen-user-info">

      <h1 id="profileName">
        admin
      </h1>

      <span class="xen-rank">
        Staff member
      </span>

      <h3>
        Administrator
      </h3>

      <p>
        Joined: Mar 6, 2026
      </p>

      <p>
        Last seen: A moment ago
      </p>

    </div>

    <div class="xen-tools">

      <button>
        Edit profile banner
      </button>

      <button>
        Moderator tools
      </button>

    </div>

  </div>

  <!-- STATS -->

  <div class="xen-stats">

    <div>

      <span>
        Messages
      </span>

      <strong>
        0
      </strong>

    </div>

    <div>

      <span>
        Reaction score
      </span>

      <strong>
        0
      </strong>

    </div>

    <div>

      <span>
        Points
      </span>

      <strong>
        0
      </strong>

    </div>

  </div>

  <!-- TABS -->

  <div class="xen-tabs">

    <button class="active-xen-tab">
      Profile posts
    </button>

    <button>
      Latest activity
    </button>

    <button>
      Postings
    </button>

    <button>
      About
    </button>

  </div>

  <!-- STATUS -->

  <div class="xen-status-box">

    <img
      src="icon.jpg"
      class="status-avatar"
    >

    <input
      type="text"
      placeholder="Update your status..."
    >

  </div>

  <!-- POSTS -->

  <div class="xen-empty-posts">

    There are no messages on this profile yet.

  </div>

</div>

<script>

async function loadUser(){

  const response = await fetch('/me');

  const data = await response.json();

  if(data.loggedIn){

    document.getElementById('profileName').innerText =
    data.username;

  }

}

loadUser();

</script>

</body>

</html>
