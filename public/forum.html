<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forum</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Sidebar -->

<aside class="sidebar">

  <div class="logo">
    He Gallery
  </div>

  <nav>

    <a href="index.html">🏠 Home</a>

    <a href="forum.html">💬 Forum</a>

  </nav>

</aside>

<!-- Top User Bar -->

<div class="top-user-bar">

  <div class="user-icons">

    <span>✉️</span>

    <span>🔔</span>

  </div>

  <div class="user-profile">

    <img src="icon.jpg" class="user-avatar" id="forumTopAvatar">

    <span id="forumTopUsername">
      Guest
    </span>

  </div>

</div>

<!-- Main -->

<main class="main">

  <!-- Header -->

  <div class="thread-page-header">

    <h1>
      Discussion Forum
    </h1>

    <button class="post-btn" onclick="showThreadBox()">
      Create Thread
    </button>

  </div>

  <!-- Create Thread -->

  <div class="reply-box" id="threadBox">

    <input
      type="text"
      id="threadTitleInput"
      class="thread-title"
      placeholder="Thread title"
    >

    <textarea
      id="threadMessageInput"
      placeholder="Write your thread..."
    ></textarea>

    <button class="post-btn" onclick="createThread()">
      Post Thread
    </button>

  </div>

  <!-- Threads -->

  <div id="threadsContainer">

  </div>

</main>

<script>

/* Show Thread Box */

function showThreadBox(){

  document.getElementById('threadBox').style.display = 'block';

}

/* Load User */

async function loadForumUser(){

  const response = await fetch('/me');

  const data = await response.json();

  if(data.loggedIn){

    document.getElementById('forumTopUsername').innerText = data.username;

  }

}

loadForumUser();

/* Create Thread */

function createThread(){

  const title = document.getElementById('threadTitleInput').value;

  const message = document.getElementById('threadMessageInput').value;

  if(!title || !message) return;

  const username = document.getElementById('forumTopUsername').innerText;

  const avatar = localStorage.getItem('profileAvatar') || 'icon.jpg';

  const thread = {

    id:Date.now(),

    title,

    message,

    username,

    avatar,

    date:'Just now',

    likes:0

  };

  let threads = JSON.parse(localStorage.getItem('forumThreads')) || [];

  threads.unshift(thread);

  localStorage.setItem('forumThreads', JSON.stringify(threads));

  renderThreads();

  document.getElementById('threadTitleInput').value = '';

  document.getElementById('threadMessageInput').value = '';

}

/* Render Threads */

function renderThreads(){

  const container = document.getElementById('threadsContainer');

  const threads = JSON.parse(localStorage.getItem('forumThreads')) || [];

  container.innerHTML = '';

  threads.forEach(thread => {

    container.innerHTML += `

    <div class="thread-post">

      <!-- User -->

      <div class="thread-user">

        <img src="${thread.avatar}" class="thread-avatar">

        <h3>
          ${thread.username}
        </h3>

        <div class="thread-user-stats">

          <p>
            Joined: 2026
          </p>

          <p>
            Member
          </p>

        </div>

        <div class="online-badge">
          Online
        </div>

      </div>

      <!-- Content -->

      <div class="thread-content">

        <div class="thread-date">
          ${thread.date}
        </div>

        <h2 style="margin-bottom:20px;">

          <a
            href="thread.html?id=${thread.id}"
            style="color:#ff4f8b;text-decoration:none;"
          >
            ${thread.title}
          </a>

        </h2>

        <div class="thread-message">

          ${thread.message}

        </div>

        <div class="thread-actions">

          <button onclick="likeThread(${thread.id})">
            👍 Like (${thread.likes})
          </button>

        </div>

      </div>

    </div>

    `;

  });

}

/* Like Thread */

function likeThread(id){

  let threads = JSON.parse(localStorage.getItem('forumThreads')) || [];

  threads = threads.map(thread => {

    if(thread.id === id){

      thread.likes++;

    }

    return thread;

  });

  localStorage.setItem('forumThreads', JSON.stringify(threads));

  renderThreads();

}

/* Load Threads */

renderThreads();

/* Load Avatar */

const savedAvatar = localStorage.getItem('profileAvatar');

if(savedAvatar){

  document.getElementById('forumTopAvatar').src = savedAvatar;

}

</script>

</body>

</html>
